[project]
name = "production-engineering-agent"
version = "0.1.0"
description = "Deterministic production engineering plans, gates, projections, and sibling requests"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "mcp>=1.29,<2",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "packaging>=26",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]
sdk-check = ["openhands-sdk==1.53.0", "openhands-tools==1.53.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodeng"]

[tool.uv]
required-version = "==0.12.23"
default-groups = ["dev", "sdk-check"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = [
  "scripts/mutation_probe.py",
  "scripts/structural_coverage.py",
  "tests/test_mutation_probe.py",
  "tests/test_structural_coverage.py",
  "plugins/prodeng/hooks/scripts/_records.py",
  "plugins/prodeng/hooks/scripts/require_records.py",
  "plugins/prodeng/hooks/scripts/blind_guard.py",
  "src/prodeng/_vrp.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# VRP v2 files are byte-identical to the wire-agent canonical copies.
"plugins/prodeng/hooks/scripts/_records.py" = ["ALL"]
"plugins/prodeng/hooks/scripts/require_records.py" = ["ALL"]
"plugins/prodeng/hooks/scripts/blind_guard.py" = ["ALL"]
"src/prodeng/_vrp.py" = ["ALL"]
# Ported from wire-agent tests/test_records.py; fixtures keep wire's line widths.
"tests/test_records.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "src",
    "scripts",
    "tests",
    "plugins/prodeng/hooks/scripts",
    "plugins/prodeng/scripts",
]
exclude = ["**/__pycache__", ".venv"]

[tool.coverage.run]
branch = true
source = ["src/prodeng"]

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance (re-baselined once for the
# vendored VRP v2 core, ADR-0010). Raise them, never lower.
c0 = 87
c1 = 72
decision = 69
c2 = 65
mcdc = 40
boundary = 57

[tool.vibebb-mutation]
# Advisory weekly mutation probe (scripts/mutation_probe.py); never a gate.
targets = ["src/prodeng/gates.py", "src/prodeng/sampling.py"]
tests = ["tests/test_gates.py", "tests/test_gate_boundaries.py"]
max_mutants = 400

[tool.coverage.report]
fail_under = 83

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = ["."]
