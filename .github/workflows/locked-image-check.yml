name: Locked image check

on:
  push:
    branches: [main]
    paths:
      - "docker/image-digests.json"
      - "plugins/prodeng/skills/prodeng-workflow/tools-image.json"
  schedule:
    - cron: "40 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  # Scope the serialization to the ref: bot-branch digest dispatches
  # otherwise take the single pending slot and cancel a queued main-push
  # check (observed on dashboard-agent 2026-10-07).
  group: locked-image-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    outputs:
      present: ${{ steps.lock.outputs.present }}
      image: ${{ steps.lock.outputs.image }}
      digest: ${{ steps.lock.outputs.digest }}
      attestation: ${{ steps.lock.outputs.attestation }}
      sbom_attestation: ${{ steps.sbom.outputs.sbom_attestation }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          lock_path = Path("docker/image-digests.json")
          present = "false"
          image = ""
          digest = ""
          attestation = ""
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              if not isinstance(lock, dict):
                  raise SystemExit("image lock must be a JSON object")
              entry = lock.get("prodeng_tools")
              if not isinstance(entry, dict):
                  raise SystemExit("image lock must contain a prodeng_tools object")
              if entry.get("image") != "ghcr.io/vibebb/prodeng-tools":
                  raise SystemExit(
                      "prodeng_tools image does not match ghcr.io/vibebb/prodeng-tools"
                  )
              if "digest" not in entry or "tag" not in entry:
                  raise SystemExit("prodeng_tools lock must contain digest and tag fields")
              digest = entry["digest"]
              tag = entry["tag"]
              if digest is None and tag is None:
                  if entry.get("attestation") is not None:
                      raise SystemExit(
                          "prodeng_tools attestation cannot exist without a pinned image"
                      )
              else:
                  if (
                      not isinstance(digest, str)
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                      or digest == f"sha256:{'0' * 64}"
                  ):
                      raise SystemExit("prodeng_tools digest must be null or a sha256 digest")
                  if (
                      not isinstance(tag, str)
                      or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None
                  ):
                      raise SystemExit(
                          "prodeng_tools tag must be null or a 40-character tools tag"
                      )
                  present = "true"
                  image = entry["image"]
                  attestation_value = entry.get("attestation")
                  if attestation_value is not None:
                      parsed = (
                          urlsplit(attestation_value)
                          if isinstance(attestation_value, str)
                          else None
                      )
                      if (
                          parsed is None
                          or parsed.scheme != "https"
                          or not parsed.netloc
                          or any(character.isspace() for character in attestation_value)
                      ):
                          raise SystemExit("prodeng_tools attestation must be an HTTPS URL")
                      attestation = attestation_value
              digest = digest if present == "true" else ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"present={present}\n")
              output.write(f"image={image}\n")
              output.write(f"digest={digest}\n")
              output.write(f"attestation={attestation}\n")
          PY
      - id: sbom
        env:
          LOCK_PATH: docker/image-digests.json
          LOCK_ENTRY: prodeng_tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(os.environ["LOCK_PATH"])
          entry = None
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("image digest lock must be a JSON object")
              entry = data.get(os.environ["LOCK_ENTRY"])
          if entry is not None and not isinstance(entry, dict):
              raise SystemExit("image lock entry must be an object")
          sbom_attestation = entry.get("sbom_attestation") if entry else None
          if entry and entry.get("digest") is None and entry.get("tag") is None:
              if sbom_attestation is not None:
                  raise SystemExit("unpublished image entry cannot have an SBOM attestation")
              sbom_attestation = ""
          elif sbom_attestation is not None:
              parsed = urlsplit(sbom_attestation) if isinstance(sbom_attestation, str) else None
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or not parsed.netloc
                  or any(character.isspace() for character in sbom_attestation)
              ):
                  raise SystemExit("image lock SBOM attestation must be an HTTPS URL")
          print(f"sbom_attestation={sbom_attestation or ''}")
          PY
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: locked-image-check
      - run: uv sync --locked
      # The attestation verifications and the image pull only need the lock
      # contents — not each other — so they run as one parallel group and
      # the pulled image is guaranteed present by the implicit wait.
      - parallel:
          - name: Warn that tools image has no attestation metadata
            if: needs.check-lock.outputs.attestation == ''
            run: echo "::warning::prodeng_tools image lock has no attestation metadata; skipping provenance verification."
          - name: Verify tools image provenance
            if: needs.check-lock.outputs.attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.image }}
              DIGEST: ${{ needs.check-lock.outputs.digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-prodeng-images.yml"
          - name: Warn when tools image has no SBOM attestation
            if: needs.check-lock.outputs.sbom_attestation == ''
            run: echo "::warning::prodeng_tools image lock has no SBOM attestation; continuing"
          - name: Verify tools image SBOM attestation
            if: needs.check-lock.outputs.sbom_attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.image }}
              DIGEST: ${{ needs.check-lock.outputs.digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-prodeng-images.yml" \
                --predicate-type https://spdx.dev/Document/v2.3
          - name: Pull locked image
            run: uv run python scripts/pull_locked_image.py --entry prodeng_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry prodeng_tools)" >> "$GITHUB_OUTPUT"
      - name: Smoke locked image
        env:
          GH_TOKEN: ${{ github.token }}
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/prodeng/scripts/prodeng_launcher.py
          out=.launcher-smoke/prodeng
          mkdir -p "$out"
          if python3 - <<'PY'
          import json
          from pathlib import Path

          entry = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))["prodeng_tools"]
          raise SystemExit(0 if entry.get("attestation") else 1)
          PY
          then
            export PRODENG_VERIFY_ATTESTATION=require
          else
            export PRODENG_VERIFY_ATTESTATION=auto
          fi
          python3 "$launcher" prewarm
          python3 "$launcher" doctor > "$out/doctor.json"
          contract=examples/smart-kettle/smart-kettle.prodeng.json
          set +e
          python3 "$launcher" gates "$contract" --json > "$out/gates.stdout.json"
          gates_status=$?
          set -e
          python3 "$launcher" export "$contract" --out "$out/smart-kettle" > "$out/export.stdout.json"
          python3 - "$out/gates.stdout.json" "$out/export.stdout.json" "$gates_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          gates_path, export_path = map(Path, sys.argv[1:3])
          gates_status = int(sys.argv[3])
          gates = json.loads(gates_path.read_text(encoding="utf-8"))
          print(json.dumps(gates.get("checks", gates), ensure_ascii=False, indent=2))
          exported = json.loads(export_path.read_text(encoding="utf-8"))
          if gates_status != 0 or gates.get("verdict") != "pass":
              raise SystemExit("production-engineering launcher gates did not pass")
          if exported.get("verdict") != "pass":
              raise SystemExit("production-engineering launcher export did not pass")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: locked-prodeng-tools-smoke
          path: ${{ github.workspace }}/.launcher-smoke/prodeng/
          if-no-files-found: ignore
