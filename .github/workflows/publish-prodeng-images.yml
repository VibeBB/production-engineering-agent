name: Publish prodeng images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/prodeng/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/e2e_authoring.py"
      - "scripts/measure_image_tools.py"
      - "scripts/print_locked_image.py"
      - "scripts/pull_locked_image.py"
      - "scripts/update_image_digest_lock.py"
      - ".github/workflows/publish-prodeng-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "!docker/image-digests.json"
      # The plugin pin is written by this workflow itself; exclude it so a
      # merged pin PR does not trigger another publish.
      - "!plugins/prodeng/skills/prodeng-workflow/tools-image.json"
      - "!docker/README.md"
  # dry_run=true rehearses the gate chain (Trivy scans, SBOM chain, tool
  # measurement, container smoke) against the locally loaded image while
  # push, :latest promotion, attestations, code-scanning SARIF, and the
  # digest-lock PR stay skipped.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse the gate chain without publishing or locking
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-prodeng-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      # Approves action_required pull_request runs on the lock branch.
      actions: write
      # Pushes the bot digest-lock branch.
      contents: write
      # Pushes the prodeng-tools image to ghcr.io.
      packages: write
      # Opens and auto-merges the digest-lock pull request.
      pull-requests: write
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      artifact-metadata: write # creates the attestation storage record
      security-events: write # uploads the Trivy SARIF scan to code scanning
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: publish
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - id: trivy-cache
        run: |
          set -euo pipefail
          echo "key=cache-trivy-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Restore-only: a publishing workflow must not write cache entries
          # (zizmor cache-poisoning); the weekly container-audit run owns
          # the save for this shared weekly key.
          lookup-only: true
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.trivy-cache.outputs.key }}
          restore-keys: cache-trivy-
      - name: Build and publish tools
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/prodeng-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          # dry_run loads the image into the local daemon (single-platform
          # build) instead of pushing so the gate chain can rehearse it.
          push: ${{ inputs.dry_run != true }}
          load: ${{ inputs.dry_run == true }}
          # Immutable tag only: a failing image must never serve :latest;
          # the tag is promoted after every gate passes.
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/prodeng-tools:${{ github.sha }}-tools
          cache-from: type=gha
          # A failed cache export must not fail the publish; gha cache
          # imports already degrade to a miss rather than an error, so
          # ignore-error applies to cache-to only.
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Resolve scan image reference
        id: scan-ref
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Push runs scan the exact pushed digest — the content the SBOM
          # and provenance attestations bind to. A dry_run build only loads
          # into the local daemon, so retag it under a slash-free local name
          # the measurement probe also accepts.
          if [ "$DRY_RUN" = "true" ]; then
            docker tag \
              "ghcr.io/${IMAGE_OWNER}/prodeng-tools:${GITHUB_SHA}-tools" \
              "prodeng-tools:${GITHUB_SHA}-rehearsal"
            echo "ref=prodeng-tools:${GITHUB_SHA}-rehearsal" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/${IMAGE_OWNER}/prodeng-tools@${BUILT_DIGEST}" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve tools digest
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
          SCAN_IMAGE_REF: ${{ steps.scan-ref.outputs.ref }}
        run: |
          set -euo pipefail
          case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid tools digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
          # The pushed digest reference on publish; the local rehearsal tag
          # on dry_run.
          TOOLS_TAG="${GITHUB_SHA}-tools"
          printf 'TOOLS_REF=%s\nTOOLS_DIGEST=%s\nTOOLS_TAG=%s\n' "$SCAN_IMAGE_REF" "$BUILT_DIGEST" "$TOOLS_TAG" >> "$GITHUB_ENV"
      # Attestation only needs the pushed digest: run it as a background
      # step overlapping every post-build leg and join it before the
      # summary/lock steps that read its attestation-url output.
      - name: Attest tools image provenance
        if: inputs.dry_run != true
        id: attest
        background: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_OWNER }}/prodeng-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true
      - name: Scan tools image (Trivy SARIF)
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Scan the exact pushed digest — the content the SBOM and
          # provenance attestations bind to (the rehearsal tag in dry_run).
          scan-ref: ${{ steps.scan-ref.outputs.ref }}
          # Shared warm DB dir; sequential legs may share it. Never place
          # trivy-action legs inside a `parallel:` group with a shared
          # cache-dir — concurrent writers corrupt the DB, and the action
          # also round-trips env vars through ./trivy_envs.txt in the job
          # cwd, which races the same way. TRIVY_CACHE_DIR env does NOT
          # override the action's cache-dir input.
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      # Independent post-build legs run as a parallel group; the JSON
      # member keeps its always() condition so the full diagnostic report
      # is still emitted when the SARIF gate above fails — exactly when
      # it is needed. SBOM generation and measurement read TOOLS_REF,
      # resolved above before any background step started.
      - parallel:
          - name: Scan tools image (Trivy JSON)
            # Runs even when the SARIF gate above found fixable CVEs, so the
            # full report is still emitted on a gate failure.
            if: always() && steps.tools.outcome == 'success'
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: image
              scan-ref: ${{ steps.scan-ref.outputs.ref }}
              # Private cache dir: this leg runs inside a parallel group,
              # and trivy-action's default cache-dir (.cache/trivy) would
              # share the DB with other legs and corrupt db/metadata.json
              # on concurrent writes.
              cache-dir: ${{ runner.temp }}/trivy-tools-json
              version: v0.75.0
              scanners: vuln,secret,misconfig,license
              ignore-unfixed: false
              exit-code: '0'
              format: json
              output: trivy-image.json
              skip-setup-trivy: true
          - name: Generate tools SPDX SBOM
            uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
            env:
              # Registry pulls on publish; a dry_run image exists only in the
              # local docker daemon.
              SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: ${{ inputs.dry_run == true && 'docker' || 'registry' }}
              TMPDIR: ${{ runner.temp }}
              SYFT_FILE_METADATA_SELECTION: none
            with:
              image: ${{ env.TOOLS_REF }}
              format: spdx-json
              output-file: ${{ runner.temp }}/prodeng-tools.full.spdx.json
              upload-artifact: false
              upload-release-assets: false
          - name: Measure published tools
            env:
              TOOLS_REF: ${{ env.TOOLS_REF }}
            run: uv run python scripts/measure_image_tools.py --image-ref "$TOOLS_REF" --out "$RUNNER_TEMP/prodeng-tools.json"
      - name: Upload Trivy SARIF
        # A rehearsal must not file code-scanning alerts.
        if: always() && inputs.dry_run != true && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-prodeng-tools
      - name: Upload Trivy JSON report
        if: always() && hashFiles('trivy-image.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodeng-tools-trivy
          path: trivy-image.json
          retention-days: 90
      - name: Summarize tools Trivy gate findings
        if: failure() && hashFiles('trivy-image.json') != ''
        run: python3 scripts/trivy_gate_summary.py trivy-image.json >> "$GITHUB_STEP_SUMMARY"
      - name: Package tools SPDX SBOM
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/prodeng-tools.full.spdx.json" \
            "$RUNNER_TEMP/prodeng-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        env:
          SBOM_PATH: ${{ runner.temp }}/prodeng-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        run: |
          python3 - "${{ runner.temp }}/prodeng-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      - name: Attest tools SBOM
        if: inputs.dry_run != true
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_OWNER }}/prodeng-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          sbom-path: ${{ runner.temp }}/prodeng-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodeng-tools-spdx-sbom
          path: ${{ runner.temp }}/prodeng-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      # e2e_authoring exits non-zero unless the gate verdict is "pass"
      # (fail-closed), so the container exit code is the smoke check. The
      # image's read-only example is copied into the container's /tmp because
      # author also writes sibling request projections next to the contract.
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prodeng-smoke"
          chmod 0777 "$RUNNER_TEMP/prodeng-smoke"
          # A dry_run image already exists in the local daemon; there is no
          # registry ref to pull.
          if [ "$DRY_RUN" != "true" ]; then
            docker pull "$TOOLS_REF"
          fi
          docker run --rm --user 10001:10001 \
            --volume "$RUNNER_TEMP/prodeng-smoke:/tmp/prodeng-smoke" "$TOOLS_REF" \
            sh -c 'set -eu
              mkdir -p /tmp/prodeng-smoke/input
              cp -R /opt/prodeng/examples/smart-kettle/. /tmp/prodeng-smoke/input/
              python /opt/prodeng/scripts/e2e_authoring.py \
                --contract /tmp/prodeng-smoke/input/smart-kettle.prodeng.json \
                --out /tmp/prodeng-smoke/smart-kettle \
                --requests-out /tmp/prodeng-smoke/requests'
      - name: Upload published tools smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-prodeng-tools-smoke
          path: |
            ${{ runner.temp }}/prodeng-smoke/**/prodeng-report.json
            ${{ runner.temp }}/prodeng-smoke/**/prodeng-report.md
            ${{ runner.temp }}/prodeng-smoke/**/*.prodeng-request.json
          if-no-files-found: ignore
      # Join the background attestation before promoting: its success is
      # one of the gates that must pass before :latest moves.
      - name: Wait for provenance attestation
        wait: attest
      - name: Promote :latest
        # Every gate above passed: copy the verified manifest to :latest
        # server-side (attestations and the SBOM keep binding the digest).
        # A gate failure leaves the previous good :latest untouched.
        if: inputs.dry_run != true
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${IMAGE_OWNER}/prodeng-tools:latest" \
            "$TOOLS_REF"
      - name: Record published image summary
        # The dry-run summary below carries the rehearsal details instead.
        if: inputs.dry_run != true
        env:
          TRIVY_OUTCOME: ${{ steps.trivy-scan.outcome }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          {
            echo "## prodeng images"
            echo
            echo "- **tools**: \`$TOOLS_REF\`"
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **tools tag**: \`$TOOLS_TAG\`"
            echo "- **Trivy gate**: ${TRIVY_OUTCOME} (no fixable HIGH/CRITICAL findings)"
            echo "- **:latest promoted**: \`ghcr.io/${IMAGE_OWNER}/prodeng-tools:latest\` -> \`$TOOLS_DIGEST\`"
            echo "- **provenance attestation**: ${ATTESTATION_URL}"
            echo "- **SBOM attestation**: ${SBOM_ATTESTATION_URL}"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update digest lock and merge PR
        # dry_run stops at the summary: no lock PR, no post-merge dispatches.
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the published
          # source commit, so the PR stays mergeable when main moved during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${TOOLS_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
            --entry prodeng_tools --image "ghcr.io/${IMAGE_OWNER}/prodeng-tools" \
            --tag "$TOOLS_TAG" --digest "$TOOLS_DIGEST" --published-at "$published_at" \
            --workflow-run "$workflow_run" --dockerfile docker/prodeng-tools.Dockerfile \
            --attestation "$ATTESTATION_URL" \
            --sbom-attestation "$SBOM_ATTESTATION_URL" \
            --tools-json "$RUNNER_TEMP/prodeng-tools.json"
          # Ship the same pin inside the plugin so an installed plugin can
          # resolve the tools image without the extension cache (the
          # launcher reads <plugin>/skills/*/tools-image.json first).
          python3 - <<'PY'
          import json

          entry = json.load(open("docker/image-digests.json"))["prodeng_tools"]
          pin = "plugins/prodeng/skills/prodeng-workflow/tools-image.json"
          with open(pin, "w", encoding="utf-8") as out:
              json.dump(entry, out, indent=2)
              out.write("\n")
          PY
          # status --porcelain (not diff --quiet) so a still-untracked lock
          # file on the very first publish is detected as a change too.
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/prodeng/skills/prodeng-workflow/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/prodeng/skills/prodeng-workflow/tools-image.json
          git commit -m "Update prodeng image digest lock"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n' \
            "The publish workflow updated the prodeng image digest lock." \
            "" \
            "tools: ${TOOLS_REF}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review.
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update prodeng image digest lock" --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          marker=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "" "ci.yml locked-image-check.yml"
          # Best-effort: surface the post-merge verification runs the pin
          # script just dispatched so the summary links them directly.
          for wf in ci.yml locked-image-check.yml; do
            url=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
              --branch main --event workflow_dispatch \
              --created ">=$marker" --json url --jq '.[0].url // empty' || true)
            if [ -n "$url" ]; then
              echo "- $wf run: $url" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Dry-run rehearsal summary
        if: always() && inputs.dry_run == true
        run: |
          {
            echo "## Publish dry-run rehearsal"
            echo
            echo "Built the tools image and ran the gate chain (Trivy scans,"
            echo "SBOM generation/packaging/guard, tool measurement, container"
            echo "smoke) against the local rehearsal tag \`$TOOLS_REF\`."
            echo "Skipped irreversible steps:"
            echo
            echo "- push of the immutable tag and :latest promotion"
            echo "- build-provenance and SBOM attestations"
            echo "- Trivy SARIF upload to code scanning"
            echo "- digest-lock PR and post-merge workflow dispatches"
          } >> "$GITHUB_STEP_SUMMARY"
