name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      docker_changed:
        # auto detects Docker-context and runtime-dependency changes; build
        # forces a rebuild; locked reuses the digest-locked published image.
        type: string
        required: false
        default: auto
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      docker_changed:
        description: "e2e image source"
        required: false
        default: auto
        type: choice
        options: [auto, build, locked]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull_request runs are cancelled; main pushes and dispatched
  # runs are never cancelled so in-flight main verification always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
      pin_script: ${{ steps.scope.outputs.pin_script }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DOCKER_CHANGED: ${{ inputs.docker_changed }}
        run: |
          set -euo pipefail
          # Recomputed below when a diff exists; early exits keep the
          # default so the pin-pr-tests job only runs on relevant PRs.
          echo "pin_script=false" >> "$GITHUB_OUTPUT"
          case "${DOCKER_CHANGED:-auto}" in
            build) echo "docker=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            locked) echo "docker=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            auto) ;;
            *) echo "::error::docker_changed must be auto, build, or locked (got '$DOCKER_CHANGED')" >&2; exit 1 ;;
          esac
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          # The image includes runtime dependencies from pyproject.toml and
          # uv.lock, so changes to either must exercise an image built from
          # this revision. The publish-owned digest lock alone is not a
          # rebuild trigger: its purpose is to test the locked-image path.
          if grep -Ev '^docker/image-digests\.json$' "$RUNNER_TEMP/changed-files" \
              | grep -Eq '^(docker/|\.dockerignore$|pyproject\.toml$|uv\.lock$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          # The digest-pin merge path is exercised only on main after
          # merge; flag its script, lock, and workflow inputs so the
          # pin-pr-tests job gates them on the stub tests.
          if grep -Eq '^(scripts/publish_image_pin_pr\.sh|scripts/digest_lock_sweep\.sh|scripts/update_image_digest_lock\.py|scripts/print_locked_image\.py|scripts/pull_locked_image\.py|scripts/run_in_locked_image\.py|docker/image-digests\.json|plugins/prodeng/skills/prodeng-workflow/tools-image\.json|\.github/workflows/publish-prodeng-images\.yml|\.github/workflows/digest-lock-sweep\.yml|\.github/workflows/locked-image-check\.yml|tests/test_publish_image_pin_pr\.py|tests/test_image_digest_lock\.py|tests/test_digest_lock_sweep\.py)$' "$RUNNER_TEMP/changed-files"; then
            echo "pin_script=true" >> "$GITHUB_OUTPUT"
          fi

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Hadolint is read-only on docker/**: overlap it with the BuildKit
      # setup + --check and join it before the job ends.
      - name: Lint Dockerfiles with hadolint
        id: hadolint
        background: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/prodeng-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/prodeng-tools.Dockerfile .
      - name: Wait for hadolint
        wait: hadolint

  pin-pr-tests:
    needs: changes
    if: needs.changes.outputs.pin_script == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: pin-pr-tests
      - name: Sync dependencies
        run: uv sync --locked
      - name: Test pin-PR and image-lock logic
        run: >-
          uv run pytest
          tests/test_publish_image_pin_pr.py
          tests/test_image_digest_lock.py
          tests/test_digest_lock_sweep.py
          -q

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          # The 3.12 and 3.13 matrix legs save uv caches concurrently; a
          # distinct suffix per leg avoids "Unable to reserve cache" races.
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        run: uv sync --locked
      - name: Verify fast stage
        id: verify-fast-stage
        run: uv run python scripts/verify_all.py --stage fast

  # Forward-compatibility canary ahead of the next stable release. Runs
  # sequentially: a tolerated step failure inside a background leg can end
  # the run as failure even when every job is green (observed on main),
  # so the canary keeps ordinary steps plus per-step continue-on-error
  # and reports failures as an annotation instead.
  canary:
    name: verify (3.15)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The canary leg builds sdists (e.g. fastuuid's pinned PyO3)
      # against a pre-release CPython; abi3 forward-compat mode lets
      # the wheel target the stable ABI instead of refusing at build
      # time.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: true
        with:
          python-version: "3.15"
          cache-suffix: verify-3.15
          # The canary's uv sync always fails while deps lack 3.15
          # wheels; a cache would only rewrite half-built sdists
          # against the repo's 10 GB cache budget.
          enable-cache: false
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: true
        run: uv sync --locked
      - name: Verify fast stage
        id: verify-fast-stage
        continue-on-error: true
        run: uv run python scripts/verify_all.py --stage fast
      - name: Report 3.15 canary outcome
        if: always() && (steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.verify-fast-stage.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  e2e:
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: e2e
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The GHCR buildcache survives the gha cache's eviction window. The
      # cache lives as a `buildcache` tag on the public prodeng-tools package
      # so anonymous pulls (local `docker buildx --cache-from`) reuse it too;
      # a separate -buildcache package would default to private. The login is
      # skipped for fork PRs (their token cannot read packages).
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync dependencies
        run: uv sync --locked
      # The e2e needs the image under test: rebuild it when docker/ changed
      # or when no lock entry exists yet (first-publish chicken-and-egg);
      # otherwise run_in_locked_image.py pulls the published digest-locked
      # image — a ~3 minute saving on non-docker changes.
      - name: Resolve e2e image source
        id: image
        env:
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker }}
        run: |
          set -euo pipefail
          build=false
          if [ "$DOCKER_CHANGED" = "true" ]; then
            build=true
          elif ! python3 -c "import json; json.load(open('docker/image-digests.json', encoding='utf-8'))['prodeng_tools']" 2>/dev/null; then
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Build prodeng-tools image for e2e
        if: steps.image.outputs.build == 'true'
        env:
          GHCR: ${{ steps.ghcr-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=(
            docker buildx build --load
            -f docker/prodeng-tools.Dockerfile -t prodeng-tools:ci
            --cache-from "type=gha,scope=prodeng-tools"
          )
          if [ "$GHCR" = "true" ]; then
            args+=(--cache-from "type=registry,ref=ghcr.io/$owner/prodeng-tools:buildcache")
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GHCR" = "true" ]; then
            args+=(--cache-to "type=registry,ref=ghcr.io/$owner/prodeng-tools:buildcache,mode=max")
          else
            args+=(--cache-to "type=gha,mode=max,scope=prodeng-tools,ignore-error=true")
          fi
          "${args[@]}" .
      - name: Author example contract end to end (inside image)
        env:
          PRODENG_TOOLS_IMAGE: ${{ steps.image.outputs.build == 'true' && 'prodeng-tools:ci' || '' }}
        run: |
          uv run python scripts/run_in_locked_image.py -- \
            python scripts/e2e_authoring.py \
            --contract examples/smart-kettle/smart-kettle.prodeng.json \
            --out out/ci/smart-kettle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prodeng-smart-kettle
          path: out/ci
          retention-days: 14

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Check plugin loads via SDK
        run: uv run --group sdk-check python scripts/check_plugin_load.py
