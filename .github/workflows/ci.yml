name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      docker_changed:
        # auto detects docker/ changes; build forces a rebuild; locked
        # reuses the digest-locked published image.
        type: string
        required: false
        default: auto
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      docker_changed:
        description: "e2e image source"
        required: false
        default: auto
        type: choice
        options: [auto, build, locked]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull_request runs are cancelled; main pushes and dispatched
  # runs are never cancelled so in-flight main verification always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
      pin_script: ${{ steps.scope.outputs.pin_script }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DOCKER_CHANGED: ${{ inputs.docker_changed }}
        run: |
          set -euo pipefail
          # Recomputed below when a diff exists; early exits keep the
          # default so the pin-pr-tests job only runs on relevant PRs.
          echo "pin_script=false" >> "$GITHUB_OUTPUT"
          case "${DOCKER_CHANGED:-auto}" in
            build) echo "docker=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            locked) echo "docker=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            auto) ;;
            *) echo "::error::docker_changed must be auto, build, or locked (got '$DOCKER_CHANGED')" >&2; exit 1 ;;
          esac
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          # docker/image-digests.json is publish-owned: a diff touching only
          # the lock means a new published pin, which the locked-image path
          # is meant to exercise — not a reason to rebuild.
          if grep -Ev '^docker/image-digests\.json$' "$RUNNER_TEMP/changed-files" \
              | grep -Eq '^(docker/|\.dockerignore$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          # The digest-pin merge path is exercised only on main after
          # merge; flag its script, lock, and workflow inputs so the
          # pin-pr-tests job gates them on the stub tests.
          if grep -Eq '^(scripts/publish_image_pin_pr\.sh|scripts/digest_lock_sweep\.sh|scripts/update_image_digest_lock\.py|scripts/print_locked_image\.py|scripts/pull_locked_image\.py|scripts/run_in_locked_image\.py|docker/image-digests\.json|plugins/prodeng/skills/prodeng-workflow/tools-image\.json|\.github/workflows/publish-prodeng-images\.yml|\.github/workflows/digest-lock-sweep\.yml|\.github/workflows/locked-image-check\.yml|tests/test_publish_image_pin_pr\.py|tests/test_image_digest_lock\.py|tests/test_digest_lock_sweep\.py)$' "$RUNNER_TEMP/changed-files"; then
            echo "pin_script=true" >> "$GITHUB_OUTPUT"
          fi

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/prodeng-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/prodeng-tools.Dockerfile .

  pin-pr-tests:
    needs: changes
    if: needs.changes.outputs.pin_script == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: pin-pr-tests
      - name: Sync dependencies
        run: uv sync --locked
      - name: Test pin-PR and image-lock logic
        run: >-
          uv run pytest
          tests/test_publish_image_pin_pr.py
          tests/test_image_digest_lock.py
          tests/test_digest_lock_sweep.py
          -q

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Forward-compatibility canary ahead of the 2026-10-09 stable
          # release: step-level continue-on-error keeps the leg green while
          # the last step reports the failure as an annotation.
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: ${{ matrix.experimental || false }}
        with:
          python-version: ${{ matrix.python-version }}
          # The 3.12 and 3.13 matrix legs save uv caches concurrently; a
          # distinct suffix per leg avoids "Unable to reserve cache" races.
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv sync --locked
      - name: Verify fast stage
        id: verify-fast-stage
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/verify_all.py --stage fast

      - name: Report 3.15 canary outcome
        if: matrix.experimental && (steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.verify-fast-stage.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  e2e:
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: e2e
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sync dependencies
        run: uv sync --locked
      # The e2e needs the image under test: rebuild it when docker/ changed
      # or when no lock entry exists yet (first-publish chicken-and-egg);
      # otherwise run_in_locked_image.py pulls the published digest-locked
      # image — a ~3 minute saving on non-docker changes.
      - name: Resolve e2e image source
        id: image
        env:
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker }}
        run: |
          set -euo pipefail
          build=false
          if [ "$DOCKER_CHANGED" = "true" ]; then
            build=true
          elif ! python3 -c "import json; json.load(open('docker/image-digests.json', encoding='utf-8'))['prodeng_tools']" 2>/dev/null; then
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Build prodeng-tools image for e2e
        if: steps.image.outputs.build == 'true'
        run: >-
          docker buildx build --load
          -f docker/prodeng-tools.Dockerfile -t prodeng-tools:ci
          --cache-from type=gha,scope=prodeng-tools
          --cache-to type=gha,mode=max,scope=prodeng-tools,ignore-error=true
          .
      - name: Author example contract end to end (inside image)
        env:
          PRODENG_TOOLS_IMAGE: ${{ steps.image.outputs.build == 'true' && 'prodeng-tools:ci' || '' }}
        run: |
          uv run python scripts/run_in_locked_image.py -- \
            python scripts/e2e_authoring.py \
            --contract examples/smart-kettle/smart-kettle.prodeng.json \
            --out out/ci/smart-kettle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodeng-smart-kettle
          path: out/ci
          retention-days: 14

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Check plugin loads via SDK
        run: uv run --group sdk-check python scripts/check_plugin_load.py
